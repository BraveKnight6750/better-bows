name: Create Release on Tag Push

on:
  push:
    tags:
      - 'v*' # Triggers only on tags starting with 'v' (e.g., v1.0.0)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # COMPILATION STEP: Fails workflow if compilation or unit tests fail
      - name: Compile and Test Project
        run: ./gradlew build

      # RELEASE STEP: Runs only if the compilation step above passes successfully
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true # Auto-generates notes from merged PRs
